name: Portfolio verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v
      - name: Verify OpenAPI is current
        run: |
          uv run python -c "import json; from pathlib import Path; from server import app; Path('postman/openapi.json').write_text(json.dumps(app.openapi(), indent=2) + '\n')"
          git diff --exit-code -- postman/openapi.json
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Run HTTP contract and browser checks
        run: |
          uv run uvicorn server:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/v1/health; then ready=1; break; fi
            sleep 1
          done
          if [ "${ready:-}" != 1 ]; then cat server.log; exit 1; fi
          curl -o- https://dl-cli.pstmn.io/install/linux64.sh | sh
          postman collection run postman/agentops-mission-control.postman_collection.json -e postman/agentops-mission-control.postman_environment.json --bail
          uv run playwright install --with-deps chromium
          BASE_URL=http://127.0.0.1:8000 uv run python tests/browser_smoke.py
